services:
  icarus:
    image: mornedhels/icarus-server:latest
    container_name: icarus
    mem_limit: 9g
    restart: unless-stopped
    ports:
      - "17777:17777/udp" # Game Port
      - "27015:27015/udp" # Steam Query Port
    env_file:
      - .env
    environment:
      - SERVER_NAME=${SERVER_NAME:-Icarus Server}
      - SERVER_PASSWORD=${SERVER_PASSWORD}
      - SERVER_ADMIN_PASSWORD=${SERVER_ADMIN_PASSWORD}
      - SERVER_MAX_PLAYERS=${SERVER_MAX_PLAYERS:-8}
      - SERVER_PORT=${SERVER_PORT:-17777}
      - SERVER_QUERYPORT=${SERVER_QUERYPORT:-27015}
      - SERVER_SHUTDOWN_IF_NOT_JOINED=${SERVER_SHUTDOWN_IF_NOT_JOINED:-300.000000}
      - SERVER_SHUTDOWN_IF_EMPTY=${SERVER_SHUTDOWN_IF_EMPTY:-60.000000}
      - SERVER_ALLOW_NON_ADMINS_LAUNCH=${SERVER_ALLOW_NON_ADMINS_LAUNCH:-True}
      - SERVER_ALLOW_NON_ADMINS_DELETE=${SERVER_ALLOW_NON_ADMINS_DELETE:-False}
      - SERVER_RESUME_PROSPECT=${SERVER_RESUME_PROSPECT:-True}
      - GAME_BRANCH=${GAME_BRANCH:-public}
      - ASYNC_TASK_TIMEOUT=${ASYNC_TASK_TIMEOUT:-60}
      - UPDATE_CRON=${UPDATE_CRON}
      - UPDATE_SKIP=${UPDATE_SKIP:-false}
      - CLEANUP_CRON=${CLEANUP_CRON}
      - CLEANUP_DAYS=${CLEANUP_DAYS:-1}
      - CLEANUP_DELETE_BACKUPS=${CLEANUP_DELETE_BACKUPS:-false}
      - CLEANUP_PRUNE_FOLDER=${CLEANUP_PRUNE_FOLDER:-pruned}
      - CLEANUP_EXCLUDES=${CLEANUP_EXCLUDES}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ./data:/home/icarus/drive_c/icarus
      - ./game:/opt/icarus
    stop_grace_period: 2m # Allow time for graceful shutdown and save

  frpc:
    image: snowdreamtech/frpc
    container_name: frpc
    restart: unless-stopped
    volumes:
      - ./frpc.toml:/etc/frp/frpc.toml:ro
    depends_on:
      - icarus

  backup:
    image: alpine:latest
    container_name: icarus-backup
    restart: unless-stopped
    environment:
      - RESTIC_PASSWORD=${RESTIC_PASSWORD}
      - RESTIC_REPOSITORY=/backups
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
    command: >
      /bin/sh -c "
      apk add --no-cache restic &&
      restic init || true &&
      while true; do
        echo 'Starting backup...'
        restic backup /data --cleanup-cache
        restic forget --keep-daily 7 --keep-weekly 4 --prune
        echo 'Backup finished. Sleeping for 4 hours...'
        sleep 14400
      done
      "
